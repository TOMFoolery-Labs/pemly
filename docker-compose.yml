services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - DATABASE_URL=${DATABASE_URL:-postgres://pemly:${POSTGRES_PASSWORD}@db:5432/pemly}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-}
      - CFSSL_BINARY_PATH=/usr/local/bin/cfssl
      - CFSSL_HOST=127.0.0.1
      - CFSSL_PORT=8888
      - CFSSL_AUTO_START=true
    volumes:
      - app_storage:/app/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/accounts/login/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # PostgreSQL database (optional - can use external database instead)
  # To use external DB: set DATABASE_URL in .env and run with --profile external
  db:
    image: postgres:16-alpine
    profiles: ["", "docker-db"]  # Included by default, excluded with --profile external
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-pemly}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-pemly}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pemly} -d ${POSTGRES_DB:-pemly}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  app_storage:
