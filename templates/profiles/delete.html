{% extends 'base.html' %}

{% block title %}Delete Profile{% endblock %}

{% block content %}
<div class="mb-8">
  <nav class="text-sm text-slate-500 mb-2">
    <a href="{% url 'core:profile_list' %}" class="hover:text-slate-700">Profiles</a>
    <span class="mx-2">/</span>
    <span class="text-slate-900">Delete</span>
  </nav>
  <h1 class="text-2xl font-semibold text-slate-900">Delete Profile</h1>
</div>

<div class="max-w-lg">
  <div class="card">
    <div class="card-body">
      <div class="flex items-start">
        <div class="flex-shrink-0">
          <svg class="h-6 w-6 text-red-600" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" />
          </svg>
        </div>
        <div class="ml-3">
          <h3 class="text-lg font-medium text-slate-900">Delete "{{ profile.name }}"?</h3>
          <p class="mt-2 text-sm text-slate-600">
            This action cannot be undone. The profile will be permanently deleted.
          </p>
        </div>
      </div>

      <form method="post" class="mt-6 flex items-center gap-4">
        {% csrf_token %}
        <button type="submit" class="btn-danger" data-loading-text="Deleting...">
          Delete Profile
        </button>
        <a href="{% url 'core:profile_list' %}" class="btn-secondary">
          Cancel
        </a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
