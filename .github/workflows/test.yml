name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pemly_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        env:
          DJANGO_SETTINGS_MODULE: pkife.settings.testing
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/pemly_test
          DJANGO_SECRET_KEY: test-secret-key-for-ci
          ENCRYPTION_KEY: dGVzdGluZ2VuY3J5cHRpb25rZXkxMjM0NTY3ODkwMTI=
        run: |
          pytest --cov=core --cov=accounts --cov-report=xml --cov-report=html

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff linter
        run: ruff check .

  # The container image is the deployment artifact, so a broken Dockerfile is a
  # broken release. Build it on every PR without pushing.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: false
          load: true
          tags: pemly:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate every compose variant renders
        working-directory: deploy/docker
        env:
          PEMLY_DOMAIN: pemly.example.test
          POSTGRES_PASSWORD: ci-placeholder
          PEMLY_ACME_EMAIL: ci@example.test
          PEMLY_ACME_DNS_PROVIDER: cloudflare
        run: |
          docker compose -f compose.yml config -q
          docker compose -f compose.yml -f compose.acme-dns.yml config -q
          docker compose -f compose.yml -f compose.external-db.yml config -q
          docker compose -f compose.yml -f compose.dev.yml config -q

      - name: Check shell scripts parse
        run: |
          bash -n deploy/install.sh
          bash -n deploy/docker/bootstrap.sh
          bash -n deploy/docker/entrypoint.sh
