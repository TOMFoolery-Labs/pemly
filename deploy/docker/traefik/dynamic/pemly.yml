# Traefik dynamic configuration for Pemly.
#
# This one file covers three of the four TLS modes:
#
#   selfsigned  no cert files present -> Traefik serves its built-in self-signed
#               certificate. This is the zero-config default.
#   file        you supplied a certificate:
#                 ./bootstrap.sh install-cert /path/cert.pem /path/key.pem
#   pemly       Pemly issued the certificate itself:
#                 docker compose exec app python manage.py issue_web_cert
#
# All three land at the same paths, so switching between them is just a matter of
# replacing the files and restarting Traefik. A restart is genuinely required: the
# file provider watches THIS directory, but certificate files named below are only
# read when the configuration is loaded. `bootstrap.sh install-cert` and
# `bootstrap.sh issue-cert` handle the restart for you.
#
# The fourth mode (ACME DNS-01) is layered on top by compose.acme-dns.yml, which
# sets a default certResolver on the websecure entrypoint. Routers here inherit it
# without needing to name it.

http:
  routers:
    pemly:
      # Match every host. Django's ALLOWED_HOSTS is the authority on which
      # hostnames are acceptable, so there is no value in duplicating that list
      # here - and it keeps this file free of environment-specific values.
      rule: "PathPrefix(`/`)"
      entryPoints:
        - websecure
      service: pemly
      # Deliberately no `tls` block. Declaring one here - even an empty one -
      # takes precedence over the entrypoint's TLS configuration and would drop
      # the ACME certResolver, leaving Traefik serving its default certificate.
      # TLS for this router comes from --entrypoints.websecure.http.tls.

  services:
    pemly:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: "http://app:8000"

# Certificates are NOT declared here. Traefik logs a Unable to append
# certificate ... to store error at ERR level for every declared file that is
# absent, on startup and on every reload - which is the normal state for the
# self-signed and ACME modes. That noise is indistinguishable from a real
# failure when reading the log.
#
# Instead, bootstrap.sh writes certificates.yml into this directory at the
# moment a certificate is actually installed (install-cert / issue-cert).

tls:
  options:
    default:
      minVersion: VersionTLS12
      sniStrict: false
